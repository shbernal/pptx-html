<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
			}
			.slide {
				position: relative;
				width: 1280px;
				height: 720px;
				overflow: hidden;
				background: #ffffff;
				font-family: Aptos, Arial, sans-serif;
			}
			.slide table {
				position: absolute;
				left: 96px;
				top: 120px;
				width: 1088px;
				border-collapse: collapse;
				font-size: 20px;
				color: #250f6b;
			}
			.slide th {
				background: #250f6b;
				color: #ffffff;
				padding: 12px;
				text-align: left;
				border: 1px solid #cccccc;
			}
			.slide td {
				padding: 12px;
				border: 1px solid #cccccc;
			}
		</style>
	</head>
	<body>
		<section class="slide">
			<table>
				<thead>
					<tr>
						<th>Workstream</th>
						<th>Owner</th>
						<th>Status</th>
					</tr>
				</thead>
				<tbody>
					<tr>
						<td>Cloud migration</td>
						<td>A. Dupont</td>
						<td>On track</td>
					</tr>
					<tr>
						<td>Data governance</td>
						<td>M. Laurent</td>
						<td>At risk</td>
					</tr>
				</tbody>
			</table>
		</section>
	</body>
</html>
