<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
			}
			.slide {
				position: relative;
				width: 1280px;
				height: 720px;
				overflow: hidden;
				font-family: Aptos, Arial, sans-serif;
			}
			.cover {
				background: linear-gradient(135deg, #250f6b, #451dc7);
			}
			.cover h1 {
				position: absolute;
				left: 96px;
				top: 300px;
				margin: 0;
				font-size: 60px;
				font-weight: 700;
				color: #ffffff;
			}
			.content {
				background: #ffffff;
			}
			.content h2 {
				position: absolute;
				left: 96px;
				top: 80px;
				margin: 0;
				font-size: 40px;
				font-weight: 700;
				color: #250f6b;
			}
			.content ul {
				position: absolute;
				left: 96px;
				top: 220px;
				width: 900px;
				margin: 0;
				padding: 0;
				list-style: none;
				font-size: 24px;
				color: #250f6b;
			}
			.content li {
				margin: 0 0 16px 0;
			}
		</style>
	</head>
	<body>
		<section class="slide cover">
			<h1>FY26 Strategy</h1>
		</section>
		<section class="slide content">
			<h2>Key Priorities</h2>
			<ul>
				<li>Accelerate cloud migration</li>
				<li>Strengthen data governance</li>
			</ul>
		</section>
	</body>
</html>
