<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
			}
			.slide {
				position: relative;
				width: 1280px;
				height: 720px;
				overflow: hidden;
				background: #ffffff;
				font-family: Aptos, Arial, sans-serif;
			}
			.slide h2 {
				position: absolute;
				left: 96px;
				top: 80px;
				margin: 0;
				font-size: 40px;
				font-weight: 700;
				color: #250f6b;
			}
			.slide ul {
				position: absolute;
				left: 96px;
				top: 200px;
				width: 900px;
				margin: 0;
				padding: 0;
				list-style: none;
				font-size: 24px;
				color: #250f6b;
			}
			.slide li {
				margin: 0 0 16px 0;
			}
		</style>
	</head>
	<body>
		<section class="slide">
			<h2>Key Priorities</h2>
			<ul>
				<li>Accelerate cloud migration</li>
				<li>Strengthen data governance</li>
				<li>Expand the partner ecosystem</li>
			</ul>
		</section>
	</body>
</html>
