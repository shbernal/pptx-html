<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
			}
			.slide {
				position: relative;
				width: 1280px;
				height: 720px;
				overflow: hidden;
				background: #ffffff;
				font-family: Aptos, Arial, sans-serif;
			}
			.row {
				position: absolute;
				left: 96px;
				top: 300px;
				display: flex;
				gap: 64px;
				font-size: 48px;
				line-height: 1;
				color: #451dc7;
			}
			.row iconify-icon {
				font-size: 48px;
			}
		</style>
	</head>
	<body>
		<section class="slide">
			<div class="row">
				<iconify-icon icon="mdi:rocket"></iconify-icon>
				<iconify-icon icon="mdi:chart-line"></iconify-icon>
				<iconify-icon icon="mdi:shield-check"></iconify-icon>
			</div>
		</section>
	</body>
</html>
