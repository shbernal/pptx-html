# The two commit-msg gates that are not about this project live in
# shbernal/lefthook-rules, so every repo runs one definition instead of its own
# drifting copy. `no-ai-attribution` rejects agent attribution trailers;
# `no-shell-quoting-leak` rejects a here-string delimiter that a shell left in
# the message, which on this machine arrives as a bare `@` on the first line.
#
# Lefthook fetches the remote on `install`, not on `run`, and caches it under
# `.git/info/lefthook-remotes/`. That is why package.json carries a `prepare`
# script: without one, a fresh clone parses this block and enforces nothing.
# Verify after cloning, `git commit` should list all three commit-msg jobs.
#
# `ref:` is a tag, never a branch. A branch would let any push to the rules repo
# change what this repo runs. `refetch_frequency` is what lets a fix reach here
# at all: without it the cached copy is permanent.
#
# A sync failure is not fatal. Lefthook prints "Couldn't sync ... Will continue
# anyway" and still exits 0, so an offline install does not break `prepare`. It
# does leave the rules unenforced until the next successful fetch.
remotes:
  - git_url: https://github.com/shbernal/lefthook-rules
    ref: v1
    configs:
      - rules/no-ai-attribution.yml
      - rules/no-shell-quoting-leak.yml
    refetch_frequency: 24h

pre-commit:
  # Sequential, not parallel. biome runs with `--write` and `stage_fixed: true`, so it
  # rewrites files and re-stages them; charcheck reads the staged content out of the
  # index. Run those two at once and charcheck is reading an index that biome is still
  # writing, on the `.ts` files both of them target. The jobs cost about a second
  # together, which is not worth a race.
  piped: true
  jobs:
    # `biome check` is lint + format + import sorting in one pass. Per-directory
    # scope (src/ is linted but never formatted) lives in biome.jsonc, so the
    # staged files can be passed in wholesale here.
    - name: biome
      glob: '*.{ts,mts,json,jsonc}'
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    # No `glob` and no `{staged_files}`: charcheck selects the staged files itself and
    # filters them through each rule's own include globs. Passing a second file list
    # means two lists that can disagree.
    #
    # No `--fix` either. A prose fix is a guess, and `stage_fixed` on a guess would
    # commit a sentence nobody read. `pnpm run lint:chars:fix` is the deliberate form.
    #
    # Every file rule is `warn` today, so this reports and does not block. It becomes a
    # gate the moment a rule flips to `error`, with no change here.
    - name: charcheck
      run: pnpm exec charcheck --staged

commit-msg:
  # The two jobs from `remotes:` merge into this list, and the local job below
  # runs first. Three jobs report on every commit message.
  jobs:
    # `{1}` is the message file git passes. Comment lines and anything below the
    # scissors are ignored, and messages git wrote itself (merge, revert, fixup,
    # squash) are skipped, so this only ever judges a sentence a human typed.
    #
    # Unlike pre-commit, this one blocks: `no-em-dash-in-commit-msg` is `error`.
    - name: charcheck
      run: pnpm exec charcheck --commit-msg {1}
