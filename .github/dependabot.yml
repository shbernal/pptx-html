version: 2

updates:
  # The one runtime dependency is pptx-ts, and its releases are the
  # events this repo most wants to hear about: a release is what makes a local
  # stopgap deletable, and what can move the coverage snapshot. Grouping the dev
  # toolchain keeps that signal from being buried under oxlint/vitest bumps.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-toolchain:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
