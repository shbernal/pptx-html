name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  validate:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 24.x
          - 26.x

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      # The round-trip gate. Runs before the browser layer and on its own so a
      # fidelity regression is reported as one, rather than as a failure buried
      # in a suite that also needs a browser to start. Needs no DOM.
      - name: Round-trip oracle
        run: pnpm run test:oracle

      # The browser test layer (test/browser/) runs the extract/e2e path in real
      # Chromium via Playwright; jsdom/happy-dom lack the layout + canvas it needs.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test
        run: pnpm run test

      - name: Build package artifacts
        run: pnpm run build
