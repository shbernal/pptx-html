name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A push that supersedes an in-flight run makes that run's answer stale, and the
# browser leg is the slowest thing here — cancel rather than pay for it twice.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Commit messages carry no AI attribution; the rule lives in .github/cchk.toml.
  commit-check:
    name: Commit messages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check commit messages against .github/cchk.toml
        uses: commit-check/commit-check-action@v2
        with:
          message: true
          branch: false

      # The rest of the old commit-msg hook: charcheck's `no-em-dash-in-commit-msg` rule,
      # and a PowerShell here-string delimiter (`@'`, `'@`) leaked into a message. Only on
      # pull requests, where the commits to check are known: base..head, merges skipped.
      - name: Setup pnpm
        if: github.event_name == 'pull_request'
        uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
          run_install: false

      - name: Setup Node
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: github.event_name == 'pull_request'
        run: pnpm install --frozen-lockfile

      - name: Check commit message prose
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          msg="$RUNNER_TEMP/commit-msg"
          quotes=$(printf '\47\42')
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$msg"
            pnpm exec charcheck --commit-msg "$msg" || { echo "::error::$sha: charcheck"; status=1; }
            if grep -qE '^@['$quotes']?[[:space:]]*$|^@['$quotes']|['$quotes']@[[:space:]]*$' "$msg"; then
              echo "::error::$sha: a here-string delimiter leaked into the message; commit it with git commit -F <file>"
              status=1
            fi
          done
          exit $status

  validate:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node:
          - 24.x
          - 26.x

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Before the lint and the typecheck both, and the order is load-bearing.
      # Each of them reads `site/`, and the site imports `pptx-html` by name —
      # resolved through the `exports` map to `dist/index.d.ts`, the way a
      # consumer's editor resolves it. With no `dist/` on disk that is errors
      # about a module that cannot be found, which is a true statement about the
      # runner and nothing at all about the code.
      #
      # The typecheck needed this first; the lint joined it when `.oxlintrc.json`
      # turned on `typeAware`, because a type-aware rule that cannot resolve an
      # import does not skip the file, it reports the unresolved name as an `error`
      # type. That failure reads as a defect in `site/` and is nothing of the kind,
      # which is exactly why it costs a release to diagnose.
      - name: Build package artifacts
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Banned characters
        run: pnpm run lint:chars

      - name: Unused files, exports and dependencies
        run: pnpm run knip

      - name: Typecheck
        run: pnpm run typecheck

      # The example is a public claim about the API, and it imports the package by
      # name rather than by relative path — so it is the only thing here that
      # exercises the `exports` map the way a consumer will. A rename that breaks
      # the entry point is invisible to `tsc` and to every test; it fails here.
      - name: Example
        run: pnpm run example

      # The round-trip gate. Runs before the browser layer and on its own so a
      # fidelity regression is reported as one, rather than as a failure buried
      # in a suite that also needs a browser to start. Needs no DOM.
      - name: Round-trip oracle
        run: pnpm run test:oracle

      - name: Unit tests
        run: pnpm run test:unit

      # The browser test layer (test/browser/) runs the extract/e2e path in real
      # Chromium via Playwright; jsdom/happy-dom lack the layout + canvas it needs.
      # Each project is invoked by name rather than through `pnpm run test`, which
      # would rebuild and re-run the oracle a second time.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm run test:browser

  # The site is the project's marketing surface, and the one place where an
  # overstated fidelity claim would be read by people who cannot check it. So the
  # publish is wired behind the same gate the library is: `needs: validate` waits
  # for every leg of the matrix, which makes it structurally impossible to publish
  # a site whose round-trip oracle is failing. That job name is load-bearing —
  # renaming `validate` silently removes the gate.
  #
  # Built on pull requests too, and only deployed from `main`. `site:build` runs
  # VitePress with dead-link checking on, which is the acceptance test for the
  # link rewriting in site/scripts/docs-source.ts; leaving it to the merge commit
  # would mean a docs edit turns `main` red instead of the PR that wrote it.
  build-site:
    name: Build site
    needs: validate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
          run_install: false

      # One version, not the matrix. The matrix exists to prove the library across
      # Node releases; the site is a single artifact and building it twice proves
      # nothing about it.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `dist/` first: the site imports `pptx-html` by name, through the `exports`
      # map, exactly as a consumer would — so the playground fails here for the
      # same reason a consumer's build would, rather than at runtime in a visitor's
      # browser.
      - name: Build package artifacts
        run: pnpm run build

      - name: Build site
        run: pnpm run site:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/.vitepress/dist

  deploy-site:
    name: Deploy site
    needs: build-site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    # Kept at job level. The workflow's own `permissions:` stays `contents: read`,
    # so publishing rights belong to the one job that publishes rather than to
    # every job in the file.
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Note that the workflow-level `cancel-in-progress` above reaches this job
      # too — job-level concurrency cannot opt out of a cancelled run. That is
      # acceptable rather than merely tolerated: `deploy-pages` cancels its pending
      # deployment on cancellation, the live site is only ever swapped atomically,
      # and the push that superseded this one publishes the newer commit anyway.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
