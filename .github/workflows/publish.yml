name: Publish

# Publishing the GitHub release is the trigger, not pushing the tag. The two are
# one command apart, but only one of them is a decision: a tag travels on a
# `git push --follow-tags` and can be cut by a script or by accident, and the
# irreversible half of a release should not be reachable that way. Publishing a
# release is deliberate, and it is the act that produces the notes a consumer
# reads — so the registry write follows it rather than racing it.
#
# A draft release triggers nothing until it is published; publishing an edited
# release re-triggers, and the registry refuses the duplicate version, which is
# the right answer rather than an error to design around.
#
# A push to `main` publishes a prerelease under the `next` dist-tag instead, so
# an unreleased fix can be installed with `pptx-html@next` rather than from a git
# URL. It never touches `latest`, and it is not a release: no tag, no notes, no
# changelog section. The `paths:` filter is the list of what goes into the
# tarball or decides what `dist/` contains; a push that only moves tests, docs or
# the site would publish a byte-identical package under a new number, and the
# coverage loop pushes those by the dozen.
#
# It lives in this file rather than one of its own because npm's trusted
# publisher names one workflow file per package. A second file could not publish.
on:
  release:
    types:
      - published
  push:
    branches:
      - main
    paths:
      - src/**
      - package.json
      - pnpm-lock.yaml
      - tsdown.config.ts
      - tsconfig.json
      - tsconfig.base.json
      - README.md
      - CHANGELOG.md
      - LICENSE
      - .github/workflows/publish.yml

# `id-token: write` is the whole mechanism. It lets this job mint a short-lived
# OIDC token that npm exchanges for a credential scoped to this package, this
# repository and this workflow file — so there is no `NPM_TOKEN` in the repo
# secrets, and adding one would be a downgrade: a stored credential outlives
# every job that uses it and is worth stealing. The exchange also stamps the
# package with provenance, which is why nothing here passes a `--provenance`
# flag; it is a property of how the credential was obtained.
#
# The filename is load-bearing. npm's trusted-publisher configuration names
# `publish.yml` specifically, so renaming this file revokes the package's
# ability to publish until the configuration is updated to match.
permissions:
  contents: read
  id-token: write

# Never cancel a publish in flight. Everything else in this repo is safe to
# supersede — the CI workflow says so itself — but a registry write is not, and
# a run killed between `prepack` and the upload is the one failure mode with no
# clean retry. Pushes to `main` share one group, so `next` publishes queue in
# order; GitHub keeps only the newest pending run, which is the one to want,
# since its commit contains every change the dropped one would have shipped.
concurrency:
  group: publish-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-24.04

    steps:
      # The release event names a tag and nothing else, so check out the tag
      # rather than trusting the default ref to be the same thing. A push names
      # its commit, and the sha is pinned for the same reason: `main` may have
      # moved by the time this job starts.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      # A release cut against a commit whose `version` was never bumped would
      # publish this tag's contents under the previous number, or be rejected by
      # the registry minutes later with a message about a duplicate. Neither is
      # a good way to find out. The tag is interpolated through the environment
      # rather than into the script, because a `${{ }}` inside `run:` is
      # substituted before the shell ever sees it.
      #
      # A push derives its version instead. A prerelease sorts below its own
      # release, so `0.2.1-next.N` would rank under a `0.2.1` that is already
      # `latest`; when `package.json` names a published version the patch is
      # bumped first, and when it names one not yet released (the bump landed
      # ahead of the tag) that version is the base as it stands. The run number
      # orders it; a re-run reuses the number, and the registry refuses the
      # duplicate if the first attempt got as far as the upload. The short sha
      # names the commit without a trip to the provenance page, and carries a
      # `g` the way `git describe` does: an all-digit sha with a leading zero
      # is not a valid semver identifier, and one push in a few hundred would
      # fail at the registry for it. The list is read rather than `npm view <name>@<version>`, which
      # exits non-zero on a missing version and would let a registry outage pass
      # for "not published yet".
      - name: Resolve the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          RUN: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          version=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
          if [ "$EVENT" = release ]; then
            if [ "$TAG" != "v$version" ]; then
              echo "::error::release tag $TAG does not match package.json version $version"
              exit 1
            fi
            dist_tag=latest
          else
            published=$(npm view pptx-html versions --json)
            if VERSION="$version" node -e 'process.exit([].concat(JSON.parse(require("node:fs").readFileSync(0, "utf8"))).includes(process.env.VERSION) ? 0 : 1)' <<< "$published"; then
              IFS=. read -r major minor patch <<< "$version"
              version="$major.$minor.$((patch + 1))"
            fi
            version="$version-next.$RUN.g${SHA::7}"
            npm pkg set version="$version"
            dist_tag=next
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"

      # The changelog is the only part of a release that cannot be reconstructed
      # afterwards from the repository, and it is the part easiest to forget. A
      # `next` build has no section to find; its changes sit under `[Unreleased]`.
      - name: Check the changelog has a section for it
        if: github.event_name == 'release'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! grep -qF "## [$VERSION]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
          run_install: false

      # One version, not the CI matrix. The matrix exists to prove the library
      # across Node releases and has already run on this commit; what happens
      # here is a build and an upload, and doing it twice would mean two
      # publishes of the same version.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Deliberately no `registry-url:`. It would write an `.npmrc` containing
      # `${NODE_AUTH_TOKEN}`, and with trusted publishing that variable does not
      # exist — pnpm refuses an unset variable in a config file rather than
      # expanding it to nothing, so the convenience would break the publish.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # `prepublishOnly` runs typecheck, lint/format and the oracle, so those are
      # covered at the moment of publishing and are not repeated here. What it
      # cannot reach is the browser layer, and that is the gap this closes: the
      # heuristic lane needs real Chromium, and a release is exactly when a
      # green oracle should not be mistaken for a green suite.
      #
      # The site is not built here. CI builds it on every push to `main`, and a
      # tag that is not on `main` has no site to deploy anyway.
      #
      # On a push this duplicates the CI run for the same commit, and that is
      # what it costs to keep `next` behind the same gate as `latest` without
      # waiting on another workflow: a `next` that skipped the suite would be the
      # one install a user reaches for to get a fix, built from a commit nobody
      # checked.
      - name: Test
        run: pnpm run test

      # The one check that imports the package by name, through the `exports`
      # map, the way a consumer will.
      - name: Example
        run: pnpm run example

      # `prepack` rebuilds `dist/` and `prepublishOnly` re-runs the gates — the
      # same two hooks a publish from a laptop would fire, so the two paths
      # cannot drift apart. `--no-git-checks` is required and not a loosening:
      # the checkout above is a detached HEAD, which is precisely what pnpm's
      # branch check exists to refuse, and for `next` the version step has just
      # edited `package.json`, which its clean-tree check would refuse too. The
      # dist-tag is passed even for `latest`, so that which tag a run moves is
      # written in one place.
      - name: Publish
        env:
          DIST_TAG: ${{ steps.version.outputs.dist-tag }}
        run: pnpm publish --no-git-checks --tag "$DIST_TAG"

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.dist-tag }}
        run: |
          {
            echo "### Published \`pptx-html@$VERSION\` as \`$DIST_TAG\`"
            echo
            echo "<https://www.npmjs.com/package/pptx-html/v/$VERSION>"
            echo
            echo "Published through npm trusted publishing, so the package carries"
            echo "provenance pointing back at this run."
          } >> "$GITHUB_STEP_SUMMARY"
